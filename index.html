<!DOCTYPE html><html lang='de'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Höki Atemstudio V9.5</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#08131f;color:#fff;font-family:Segoe UI}#bg{position:fixed;inset:0;background:radial-gradient(circle at center,rgba(126,231,255,.12),transparent 45%),radial-gradient(circle,#102236,#071019 70%)}.gear{position:fixed;top:16px;right:16px;background:#132333cc;padding:10px 14px;border-radius:12px;cursor:pointer;z-index:10}#panel{display:none;position:fixed;top:65px;right:16px;width:260px;background:#132333;padding:12px;border-radius:12px;z-index:10}select,input,button{width:100%;margin:4px 0}.blob{position:absolute;left:50%;top:42%;transform-origin:center center;border-radius:50%}#l1{width:280px;height:280px;margin:-140px 0 0 -140px;background:radial-gradient(circle at 30% 30%,#fff,#b9f6ff 35%,#7ee7ff 70%,#56d8ef)}#l2{width:380px;height:380px;margin:-190px 0 0 -190px;background:#7ee7ff;opacity:.22;filter:blur(14px)}#l3{width:520px;height:520px;margin:-260px 0 0 -260px;background:#7ee7ff;opacity:.1;filter:blur(30px)}#phase{position:fixed;top:72%;left:0;right:0;text-align:center;font-size:50px;transition:opacity 1s}#timer{position:fixed;top:80%;left:0;right:0;text-align:center;opacity:.7}#custom{display:none}</style></head><body><div id='bg'></div><div class='gear' onclick="panel.style.display=panel.style.display==='block'?'none':'block'">⚙️</div><div id='panel'><select id='preset'><option value='4,2,8'>Höki 4-2-8</option><option value='4,0,6'>Recreaziun 4-6</option><option value='5,0,5'>Coerent 5-5</option><option value='4,4,4,4'>Box 4-4-4-4</option><option value='4,7,8'>Durmir 4-7-8</option></select><select id='duration'><option value='2' selected>2 Min</option><option value='5'>5 Min</option><option value='10'>10 Min</option><option value='15'>15 Min</option><option value='0'>Sainza fin</option></select><select id='view'><option value='normal'>Normal</option><option value='textfree'>Sainza text</option></select><button onclick="custom.style.display=custom.style.display==='block'?'none':'block'">Agen ritem</button><div id='custom'><input id='ein' value='4'><input id='h1' value='2'><input id='aus' value='8'><input id='h2' value='0'><button onclick='applyCustom()'>Surtour</button></div></div><div id='l3' class='blob'></div><div id='l2' class='blob'></div><div id='l1' class='blob'></div><div id='phase'>EINATMEN</div><div id='timer'></div><script>let phases=[];function setR(a,b,c,d){phases=d>0?[['EINATMEN',a,.92,1.4],['HALTEN',b,1.4,1.4],['AUSATMEN',c,1.4,.92],['HALTEN',d,.92,.92]]:[['EINATMEN',a,.92,1.4],...(b>0?[['HALTEN',b,1.4,1.4]]:[]),['AUSATMEN',c,1.4,.92]]}setR(4,2,8,0);let sessionStart=Date.now(),cycles=0,i=0,start=performance.now(),pauseUntil=0;preset.onchange=()=>{let a=preset.value.split(',').map(Number);setR(a[0],a[1],a[2],a[3]||0);reset()};function applyCustom(){setR(+ein.value,+h1.value,+aus.value,+h2.value);reset()}function reset(){sessionStart=Date.now();cycles=0;i=0;start=performance.now();phase.style.opacity='1'}const ease=t=>0.5-Math.cos(Math.PI*t)/2;function morph(el,n,k){el.style.borderRadius=`${50+Math.sin(n/(1300*k))*8}% ${50+Math.cos(n/(1700*k))*8}% ${50+Math.sin(n/(1900*k))*8}% ${50+Math.cos(n/(2300*k))*8}% / ${50+Math.cos(n/(1500*k))*8}% ${50+Math.sin(n/(1800*k))*8}% ${50+Math.cos(n/(2100*k))*8}% ${50+Math.sin(n/(2400*k))*8}%`;}function loop(now){let max=+duration.value;if(max>0){let rem=max*60-Math.floor((Date.now()-sessionStart)/1000);if(rem<=0){phase.textContent='✨ finida la sessiun ';timer.innerHTML=cycles+' rundas da respiraziun<br><button onclick="location.reload()">amo üna giada</button>';return;}timer.textContent=Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0');}else timer.textContent='∞';if(view.value==='textfree')phase.style.display='none';else phase.style.display='block';if(now<pauseUntil){requestAnimationFrame(loop);return;}let ph=phases[i],e=(now-start)/1000;if(e>=ph[1]){i=(i+1)%phases.length;if(i===0){cycles++;if(cycles>=5)phase.style.opacity='0.15';}start=now;pauseUntil=now+150;ph=phases[i]}let t=ease(Math.min((now-start)/1000/ph[1],1));let s=ph[2]+(ph[3]-ph[2])*t;l1.style.transform=`scale(${s})`;l2.style.transform=`scale(${s*1.06})`;l3.style.transform=`scale(${s*1.12})`;morph(l1,now,1);morph(l2,now,1.8);morph(l3,now,2.8);const labels={
  EINATMEN:'AINT TRAS IL NAS',
  HALTEN:'TEGNER',
  AUSATMEN:'OURA TRAS LA BOCCA'
};
phase.textContent=labels[ph[0]];requestAnimationFrame(loop)}requestAnimationFrame(loop);document.addEventListener('mousemove',()=>phase.style.opacity='1');</script></body></html>
